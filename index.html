const GITHUB_OWNER  = "YOUR_GITHUB_USERNAME";   // e.g. "john"
const GITHUB_REPO   = "YOUR_REPO_NAME";          // e.g. "webview-builder"
const GITHUB_TOKEN  = "YOUR_PAT_TOKEN";          // GitHub Personal Access Token
//   ^ Keep this private! In production, proxy through your own backend.
// ─────────────────────────────────────────────────

const SECRET_SALT = "WEB2APP_SECURITY_KEY_2026";

const generateCode = (email) => {
    const cleanEmail = email.trim().toLowerCase();
    let hash = 0;
    const combined = cleanEmail + SECRET_SALT;
    for (let i = 0; i < combined.length; i++) {
        hash = (hash << 5) - hash + combined.charCodeAt(i);
        hash |= 0;
    }
    const pos = Math.abs(hash).toString(36).toUpperCase();
    return `AAB-${pos.substring(0,4)}-${pos.substring(4,8)}`;
};

// ── Icons ─────────────────────────────────────────
const SmartphoneIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>;

const LockIcon       = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
const MsgIcon        = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>;

// ── GitHub API helpers ─────────────────────────────

/** Trigger a workflow_dispatch run */
async function triggerBuild({ appName, websiteUrl, packageName }) {
    const res = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/build-apk.yml/dispatches`,
        {
            method: "POST",
            headers: {
                Authorization: `Bearer ${GITHUB_TOKEN}`,
                Accept: "application/vnd.github+json",
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                ref: "main",          // branch name
                inputs: {
                    app_name:     appName,
                    website_url:  websiteUrl,
                    package_name: packageName,
                },
            }),
        }
    );
    if (!res.ok) throw new Error(`Trigger failed: ${res.status}`);
}

/** Poll runs until the latest one is "completed" */
async function waitForRun(timeoutMs = 300000) {
    const start = Date.now();
    let runId = null;

    while (Date.now() - start < timeoutMs) {
        await sleep(5000);

        const res = await fetch(
            `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/runs?per_page=5`,
            { headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: "application/vnd.github+json" } }
        );
        const data = await res.json();
        const run = data.workflow_runs?.find(r => r.name === "Build WebView APK" && r.status !== "completed");
        const done = data.workflow_runs?.find(r => r.name === "Build WebView APK" && r.status === "completed" && r.conclusion === "success");

        if (done && (!runId || done.id === runId)) return done.id;
        if (run) runId = run.id;
    }
    throw new Error("Build timed out after 5 minutes.");
}

/** Fetch the artifact download URL from a completed run */
async function getArtifactUrl(runId) {
    const res = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/runs/${runId}/artifacts`,
        { headers: { Authorization: `Bearer ${GITHUB_TOKEN}`, Accept: "application/vnd.github+json" } }
    );
    const data = await res.json();
    const artifact = data.artifacts?.[0];
    if (!artifact) throw new Error("No artifact found.");

    // The archive_download_url requires auth — open in new tab or use backend proxy
    return artifact.archive_download_url;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── App ───────────────────────────────────────────
function App() {
    const [view, setView]             = useState('home');
    const [isAdminAuth, setIsAdminAuth] = useState(false);
    const [toast, setToast]           = useState({ show: false, message: '', type: 'info' });
    const [appData, setAppData]       = useState({
        name: '', url: '', packageName: 'com.web2app.custom', icon: null, splash: null,
    });

    // ← CHANGED: build state now tracks GitHub run status
    const [buildPhase, setBuildPhase] = useState('idle'); // idle | queuing | waiting | done | error
    const [buildMsg, setBuildMsg]     = useState('');
    const [downloadUrl, setDownloadUrl] = useState('');
    const [runId, setRunId]           = useState(null);

    const notify = (message, type = 'info') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 6000);
    };

    const handleFileChange = (e, field) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => setAppData(prev => ({ ...prev, [field]: reader.result }));
        reader.readAsDataURL(file);
    };

    // ← CHANGED: real GitHub build pipeline
    const startBuild = async () => {
        if (!appData.name || !appData.url) {
            notify("Please provide both the App Name and Website URL.", "error");
            return;
        }

        const slug = appData.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        const pkg  = appData.packageName === 'com.web2app.custom'
                     ? `com.web2app.${slug || 'app'}`
                     : appData.packageName;
        setAppData(prev => ({ ...prev, packageName: pkg }));

        setView('building');
        setBuildPhase('queuing');
        setBuildMsg('Sending build request to GitHub...');

        try {
            await triggerBuild({ appName: appData.name, websiteUrl: appData.url, packageName: pkg });

            setBuildPhase('waiting');
            setBuildMsg('Build queued. Compiling on GitHub Actions (~2–4 min)...');

            const completedRunId = await waitForRun();
            setRunId(completedRunId);

            const url = await getArtifactUrl(completedRunId);
            setDownloadUrl(url);

            setBuildPhase('done');
            setView('result');
        } catch (err) {
            setBuildPhase('error');
            setBuildMsg(err.message || 'Unknown error.');
            notify("Build failed: " + err.message, "error");
        }
    };

    // ← CHANGED: opens the real artifact ZIP (GitHub wraps APKs in a zip)
    const downloadApk = () => {
        if (!downloadUrl) return;
        // GitHub artifact download requires auth; open with token via fetch + blob
        fetch(downloadUrl, {
            headers: { Authorization: `Bearer ${GITHUB_TOKEN}` }
        })
        .then(r => r.blob())
        .then(blob => {
            const slug = appData.name.trim().toLowerCase().replace(/[^a-z0-9]/g, '_') || 'app';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${slug}_apk.zip`; // contains the .apk inside
            link.click();
            URL.revokeObjectURL(link.href);
            notify("Download started! Unzip to get your .apk", "success");
        })
        .catch(() => notify("Download failed. Try opening the GitHub Actions page.", "error"));
    };

    return (
        <div className="min-h-screen flex flex-col">
            {toast.show && (
                <div className="fixed top-4 left-4 right-4 z-50">
                    <div className={`p-4 rounded-xl shadow-2xl border text-xs font-bold flex items-center space-x-2
                        ${toast.type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`}>
                        <div className="flex-1 leading-snug">{toast.message}</div>
                        <button onClick={() => setToast({ show: false })} className="font-extrabold opacity-60">✕</button>
                    </div>
                </div>
            )}

            <nav className="bg-indigo-600 text-white shadow-md px-4 py-4 sticky top-0 z-40">
                <div className="max-w-4xl mx-auto flex justify-between items-center">
                    <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('home')}>
                        <SmartphoneIcon />
                        <span className="font-extrabold text-lg">Web2App Creator</span>
                    </div>
                    <button onClick={() => setView('admin')}
                        className="flex items-center text-indigo-100 hover:text-white text-xs font-bold border border-indigo-400/50 rounded-xl px-3 py-2 transition-all active:scale-95">
                        <ShieldIcon /><span className="ml-1.5">Master Admin</span>
                    </button>
                </div>
            </nav>

            <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6 flex flex-col justify-center animate-fadeIn">

                {/* HOME */}
                {view === 'home' && (
                    <div className="text-center py-6 space-y-6 max-w-md mx-auto">
                        <h1 className="text-3xl font-extrabold text-slate-950 leading-tight">
                            Convert Website into <span className="text-indigo-600">Real APK File</span>
                        </h1>
                        <p className="text-sm text-slate-600">GitHub Actions compiles a genuine Android WebView app — no fake files.</p>
                        <div className="bg-white rounded-2xl p-5 border border-slate-200 text-left space-y-4 shadow-sm">
                            <div className="flex items-start space-x-3">
                                <div className="bg-green-100 text-green-700 px-2 py-1 rounded-md text-xs font-black mt-0.5">FREE</div>
                                <div>
                                    <h4 className="font-bold text-sm text-slate-900">Real WebView APK</h4>
                                    <p className="text-xs text-slate-500">Compiled on GitHub Actions. Installs on any Android device.</p>
                                </div>
                            </div>
                            <div className="flex items-start space-x-3">
                                <div className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-md text-xs font-black mt-0.5">CODES</div>
                                <div>
                                    <h4 className="font-bold text-sm text-slate-900">Google Play Store AAB</h4>

                                </div>
                            </div>
                        </div>
                        <button onClick={() => setView('builder')}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95 text-sm">
                            Start Designing App
                        </button>
                    </div>
                )}

                {/* BUILDER */}
                {view === 'builder' && (
                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5 max-w-md mx-auto w-full">

                            <span>Design Workspace</span>
                            <span className="text-xs text-indigo-600 font-bold bg-indigo-50 px-2 py-1 rounded-lg">Step 1 of 2</span>
                        </h2>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">App Name *</label>
                                <input type="text"
                                    className="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold text-slate-800"
                                    placeholder="e.g. My Custom Shop"
                                    value={appData.name}
                                    onChange={e => setAppData({...appData, name: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Target Website URL *</label>
                                <input type="url"
                                    className="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold text-slate-800"
                                    placeholder="https://yourwebsite.com"
                                    value={appData.url}
                                    onChange={e => setAppData({...appData, url: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Package Name</label>
                                <input type="text"
                                    className="w-full border border-slate-200 bg-slate-50 text-slate-400 rounded-xl px-4 py-3 text-xs outline-none font-mono"
                                    value={appData.packageName}
                                    onChange={e => setAppData({...appData, packageName: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-2 gap-3 pt-2">
                                {['icon','splash'].map(field => (
                                    <div key={field} className="border border-slate-200 rounded-xl p-3 text-center bg-slate-50/50">
                                        <span className="block text-[9px] font-black text-slate-400 uppercase mb-2">
                                            {field === 'icon' ? 'APP LOGO' : 'SPLASH SCREEN'}
                                        </span>
                                        <label className="cursor-pointer inline-block bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-700 shadow-sm active:bg-slate-50">
                                            Select File

                                        </label>
                                        {appData[field] && <div className="mt-1.5 text-[9px] text-indigo-600 font-bold">✓ Uploaded</div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <button onClick={startBuild}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3.5 rounded-xl text-sm shadow-md transition-all active:scale-95">
                            Build on GitHub Actions
                        </button>
                    </div>
                )}

                {/* BUILDING */}
                {view === 'building' && (
                    <div className="text-center py-12 space-y-6 max-w-sm mx-auto animate-fadeIn">
                        {buildPhase !== 'error'
                            ? <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>

                        <div>

                                {buildPhase === 'error' ? 'Build Failed' : 'Compiling on GitHub…'}
                            </h3>
                            <p className="text-slate-500 text-[11px] font-mono mt-1">{buildMsg}</p>
                        </div>
                        {buildPhase === 'error' && (
                            <button onClick={() => setView('builder')}
                                className="bg-indigo-600 text-white font-extrabold px-6 py-2.5 rounded-xl text-sm">

                        {buildPhase === 'waiting' && (

                        )}

                )}

                {/* RESULT */}
                {view === 'result' && (
                    <ResultView
                        appData={appData}
                        downloadApk={downloadApk}
                        showNotification={notify}
                    />
                )}

                {/* ADMIN */}
                {view === 'admin' && (
                    <AdminView
                        isAdminAuth={isAdminAuth}
                        setIsAdminAuth={setIsAdminAuth}
                        showNotification={notify}
                    />
                )}
            </main>
        </div>
    );
}

            {showModal && (

        <div className="max-w-sm mx-auto w-full bg-white rounded-2xl p-6 border shadow-sm space-y-4">
            <div className="text-center">
                <h3 className="font-extrabold text-slate-900 text-lg">Admin Authentication</h3>
                <p className="text-slate-500 text-xs mt-1">Provide your master secret token.</p>
            </div>
            {errorMsg && <p className="text-xs text-red-500 text-center font-bold">{errorMsg}</p>}
            <div className="space-y-4">
                <input type="password" className="w-full border rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-semibold"
                    placeholder="Master Password" value={password} onChange={e => setPassword(e.target.value)} />
                <button onClick={handleLogin} className="w-full bg-slate-800 text-white font-extrabold py-3 rounded-xl text-sm active:scale-95 transition-all">
                    Enter Workspace
                </button>
            </div>
        </div>
    );

    return (
        <div className="space-y-4 max-w-md mx-auto w-full">
            <div className="bg-white rounded-2xl p-5 border shadow-sm flex justify-between items-center">
                <div>
                    <span className="font-extrabold text-sm text-slate-900">Admin Controls</span>
                    <p className="text-[10px] text-slate-500">Generate offline access tokens</p>
                </div>
                <button onClick={() => setIsAdminAuth(false)} className="text-xs text-red-500 font-extrabold bg-red-50 px-3 py-1.5 rounded-lg">Close</button>
            </div>
            <div className="bg-white rounded-2xl p-5 border shadow-sm space-y-3">
                <h4 className="font-extrabold text-xs text-slate-400 uppercase">Generate New Access Code</h4>
                <div className="space-y-3">
                    <input type="email" required
                        className="w-full border rounded-xl px-3 py-2 text-xs outline-none font-semibold text-slate-800"
                        placeholder="client-email@example.com"
                        value={targetEmail} onChange={e => setTargetEmail(e.target.value)} />
                    <button onClick={handleGenerate}
                        className="w-full bg-indigo-600 text-white font-extrabold py-2.5 rounded-xl text-xs active:scale-95 transition-all">
                        Generate Token
                    </button>
                </div>
                {generatedResult && (
                    <div className="bg-slate-50 p-4 border rounded-xl text-center space-y-1">
                        <p className="text-[10px] font-extrabold text-slate-400">SEND TO USER</p>
                        <p className="text-indigo-600 font-mono font-black text-lg tracking-wider select-all">{generatedResult}</p>
                        <p className="text-[9px] text-slate-400">Bound to the email above.</p>
                    </div>
                )}
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
