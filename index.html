<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2App Pro - Convert Website to APK & AAB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Inline SVG Icons to guarantee mobile rendering without external dependencies
        const SmartphoneIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-smartphone"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        );
        const ShieldIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-shield"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        );
        const DownloadIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );
        const KeyIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-key"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 1.5 1.5M15.5 7.5 14 6"/></svg>
        );
        const MessageCircleIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-message-circle"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        );

        function App() {
            const [currentView, setCurrentView] = useState('home'); 
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            
            const [appData, setAppData] = useState({
                name: '',
                url: '',
                packageName: 'com.example.app',
                icon: null,
                splash: null,
                themeColor: '#4f46e5'
            });
            
            const [buildProgress, setBuildProgress] = useState(0);
            const [buildStep, setBuildStep] = useState('');
            const [accessCodes, setAccessCodes] = useState([
                { email: 'user@example.com', code: 'AAB-DEMO-99', used: false, date: new Date().toLocaleDateString() }
            ]);

            const handleFileChange = (e, field) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setAppData(prev => ({ ...prev, [field]: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const startBuild = () => {
                if (!appData.name || !appData.url) {
                    alert("Please fill in both the App Name and Website URL.");
                    return;
                }
                setCurrentView('building');
                setBuildProgress(0);
                
                const steps = [
                    "Setting up compiler sandbox...",
                    "Parsing target URL and structure...",
                    "Generating Android Manifest asset records...",
                    "Scaling icons and splash screen parameters...",
                    "Compiling native Java wrappers...",
                    "Compiling production APK target file...",
                    "Signing binary keys for release build...",
                    "Generating Android App Bundle (AAB)...",
                    "Success! Assets packing finalized."
                ];

                let stepIndex = 0;
                const interval = setInterval(() => {
                    setBuildProgress((prev) => {
                        const next = prev + (100 / steps.length);
                        if (next >= 100) {
                            clearInterval(interval);
                            setTimeout(() => setCurrentView('result'), 500);
                            return 100;
                        }
                        return next;
                    });
                    setBuildStep(steps[stepIndex]);
                    stepIndex++;
                }, 1000);
            };

            const downloadDummyFile = (extension) => {
                const content = `Simulated ${extension.toUpperCase()} build file for app: ${appData.name}.`;
                const element = document.createElement("a");
                const file = new Blob([content], {type: 'application/octet-stream'});
                element.href = URL.createObjectURL(file);
                element.download = `${appData.name.replace(/\s+/g, '_').toLowerCase()}.${extension}`;
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <nav className="bg-indigo-600 text-white shadow-md px-4 py-4 sticky top-0 z-40">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setCurrentView('home')}>
                                <SmartphoneIcon />
                                <span className="font-bold text-lg tracking-tight">Web2App Creator</span>
                            </div>
                            <button 
                                onClick={() => setCurrentView('admin')}
                                className="flex items-center text-indigo-100 hover:text-white text-sm font-semibold border border-indigo-400/50 rounded-lg px-3 py-1.5"
                            >
                                <ShieldIcon />
                                <span className="ml-1 hidden xs:inline">Admin Panel</span>
                            </button>
                        </div>
                    </nav>

                    {/* Main Container */}
                    <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6">
                        {currentView === 'home' && (
                            <div className="text-center py-8 space-y-6">
                                <h1 className="text-3xl font-extrabold text-slate-900 leading-tight">
                                    Turn Any Website into a Professional <span className="text-indigo-600">Android App</span>
                                </h1>
                                <p className="text-base text-slate-600 max-w-md mx-auto">
                                    Quickly configure, brand, and build functional APK and Google Play AAB binaries. Free APK downloads for testing!
                                </p>
                                
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 text-left space-y-4 max-w-md mx-auto">
                                    <h3 className="font-bold text-slate-800 text-lg">Platform Offerings:</h3>
                                    <div className="flex items-start space-x-3">
                                        <div className="bg-green-100 text-green-700 p-2 rounded-lg font-bold text-xs mt-0.5">FREE</div>
                                        <div>
                                            <h4 className="font-semibold text-sm">Download APK</h4>
                                            <p className="text-xs text-slate-500">Perfect to install directly on your phone and test all website features.</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start space-x-3">
                                        <div className="bg-indigo-100 text-indigo-700 p-2 rounded-lg font-bold text-xs mt-0.5">KEYS</div>
                                        <div>
                                            <h4 className="font-semibold text-sm">Download Google Play AAB</h4>
                                            <p className="text-xs text-slate-500">Requires a secure master admin download access code to unlock.</p>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setCurrentView('builder')}
                                    className="w-full max-w-md bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95"
                                >
                                    Get Started
                                </button>
                            </div>
                        )}

                        {currentView === 'builder' && (
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
                                <h2 className="text-xl font-bold text-slate-800 border-b pb-3">App Configuration</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">App Name *</label>
                                        <input 
                                            type="text" 
                                            className="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                            placeholder="e.g. My Online Store"
                                            value={appData.name}
                                            onChange={(e) => setAppData({...appData, name: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Website URL *</label>
                                        <input 
                                            type="url" 
                                            className="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                            placeholder="https://example.com"
                                            value={appData.url}
                                            onChange={(e) => setAppData({...appData, url: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-500 mb-1">App Packagename</label>
                                        <input 
                                            type="text" 
                                            className="w-full border border-slate-300 bg-slate-50 text-slate-400 rounded-xl px-4 py-3 text-sm"
                                            value={appData.packageName}
                                            onChange={(e) => setAppData({...appData, packageName: e.target.value})}
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 pt-2">
                                        <div className="border border-slate-200 rounded-xl p-4 text-center bg-slate-50">
                                            <span className="block text-xs font-bold text-slate-500 mb-2">APP ICON</span>
                                            <label className="cursor-pointer inline-block bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm">
                                                Select Icon
                                                <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileChange(e, 'icon')} />
                                            </label>
                                            {appData.icon && <div className="mt-2 text-[10px] text-green-600 font-bold">✓ Selected</div>}
                                        </div>
                                        <div className="border border-slate-200 rounded-xl p-4 text-center bg-slate-50">
                                            <span className="block text-xs font-bold text-slate-500 mb-2">SPLASH SCREEN</span>
                                            <label className="cursor-pointer inline-block bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm">
                                                Select Image
                                                <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileChange(e, 'splash')} />
                                            </label>
                                            {appData.splash && <div className="mt-2 text-[10px] text-green-600 font-bold">✓ Selected</div>}
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={startBuild}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl mt-4"
                                >
                                    Build My Application
                                </button>
                            </div>
                        )}

                        {currentView === 'building' && (
                            <div className="text-center py-12 space-y-6">
                                <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                <div>
                                    <h3 className="text-xl font-bold text-slate-800">Generating App Package</h3>
                                    <p className="text-slate-500 text-xs font-mono mt-1">{buildStep}</p>
                                </div>
                                <div className="max-w-xs mx-auto bg-slate-200 rounded-full h-3 overflow-hidden">
                                    <div className="bg-indigo-600 h-full transition-all duration-300" style={{ width: `${buildProgress}%` }}></div>
                                </div>
                            </div>
                        )}

                        {currentView === 'result' && (
                            <ResultView 
                                appData={appData} 
                                accessCodes={accessCodes} 
                                setAccessCodes={setAccessCodes} 
                                downloadFile={downloadDummyFile} 
                            />
                        )}

                        {currentView === 'admin' && (
                            <AdminView 
                                isAdminAuth={isAdminAuth} 
                                setIsAdminAuth={setIsAdminAuth} 
                                accessCodes={accessCodes} 
                                setAccessCodes={setAccessCodes} 
                            />
                        )}
                    </main>
                </div>
            );
        }

        function ResultView({ appData, accessCodes, setAccessCodes, downloadFile }) {
            const [showModal, setShowModal] = useState(false);
            const [email, setEmail] = useState('');
            const [code, setCode] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const handleUnlock = (e) => {
                e.preventDefault();
                setErrorMsg('');
                const foundIndex = accessCodes.findIndex(
                    item => item.email.toLowerCase() === email.toLowerCase() && item.code === code.trim().toUpperCase()
                );

                if (foundIndex !== -1) {
                    if (accessCodes[foundIndex].used) {
                        setErrorMsg("This unique access code has already been used!");
                    } else {
                        const updated = [...accessCodes];
                        updated[foundIndex].used = true;
                        setAccessCodes(updated);
                        setShowModal(false);
                        downloadFile('aab');
                    }
                } else {
                    setErrorMsg("Invalid email or unmatched developer access code.");
                }
            };

            const whatsappMessage = encodeURIComponent(`Hi, I built my app "${appData.name}" on Web2App. I would like to purchase the AAB Access Code for email: `);

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 text-center space-y-4">
                        <div className="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto text-green-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800">Your Build is Ready!</h2>
                        <p className="text-sm text-slate-500">Choose the format you wish to download below.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white border border-slate-200 rounded-2xl p-5 flex flex-col justify-between">
                            <div>
                                <h3 className="font-bold text-lg text-slate-800">Direct APK Download</h3>
                                <p className="text-xs text-slate-500 mt-1">Directly installable file to instantly test on any mobile device.</p>
                                <div className="text-green-600 font-bold text-sm my-3">FREE</div>
                            </div>
                            <button 
                                onClick={() => downloadFile('apk')}
                                className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl text-sm"
                            >
                                Download APK
                            </button>
                        </div>

                        <div className="bg-white border-2 border-indigo-200 rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden">
                            <div className="absolute top-0 right-0 bg-indigo-600 text-white text-[9px] font-bold px-3 py-1 rounded-bl-lg">STORE FORMAT</div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800">Google Play AAB</h3>
                                <p className="text-xs text-slate-500 mt-1">Official App Bundle wrapper. Required to publish your app on the Google Play Store.</p>
                                <div className="text-indigo-600 font-bold text-xs my-3 flex items-center">
                                    <span className="inline-block w-1.5 h-1.5 bg-indigo-600 rounded-full mr-1.5"></span>
                                    Requires Admin Code
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowModal(true)}
                                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm"
                            >
                                Unlock AAB File
                            </button>
                        </div>
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-in fade-in zoom-in-95 duration-150">
                                <div className="bg-indigo-600 p-4 flex justify-between items-center text-white">
                                    <span className="font-bold text-sm">Enter Access Credentials</span>
                                    <button onClick={() => setShowModal(false)} className="text-indigo-200 hover:text-white font-bold">✕</button>
                                </div>
                                <form onSubmit={handleUnlock} className="p-5 space-y-4">
                                    {errorMsg && <p className="text-xs text-red-500 bg-red-50 p-2.5 rounded-lg border border-red-100">{errorMsg}</p>}
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Your Email</label>
                                        <input 
                                            type="email" 
                                            required
                                            className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none" 
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Access Code</label>
                                        <input 
                                            type="text" 
                                            required
                                            className="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none font-mono" 
                                            placeholder="AAB-XXXX"
                                            value={code}
                                            onChange={(e) => setCode(e.target.value)}
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm">
                                        Verify & Download AAB
                                    </button>
                                    
                                    <div className="border-t pt-4 text-center">
                                        <p className="text-xs text-slate-500 mb-2">Need a code? Contact us via WhatsApp</p>
                                        <a 
                                            href={`https://wa.me/917356788454?text=${whatsappMessage}`}
                                            target="_blank"
                                            className="inline-flex items-center justify-center w-full bg-[#25D366] text-white font-bold py-2 rounded-xl text-xs space-x-1"
                                        >
                                            <MessageCircleIcon />
                                            <span>Chat with Master Admin</span>
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminView({ isAdminAuth, setIsAdminAuth, accessCodes, setAccessCodes }) {
            const [password, setPassword] = useState('');
            const [targetEmail, setTargetEmail] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            // Master password set by you
            const ADMIN_PASSWORD = 'admin';

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === ADMIN_PASSWORD) {
                    setIsAdminAuth(true);
                    setErrorMsg('');
                } else {
                    setErrorMsg("Incorrect admin panel access password.");
                }
            };

            const generateNewCode = (e) => {
                e.preventDefault();
                if (!targetEmail) return;
                const randomVal = Math.random().toString(36).substring(2, 7).toUpperCase();
                const freshCode = `AAB-${randomVal}`;
                setAccessCodes([
                    { email: targetEmail, code: freshCode, used: false, date: new Date().toLocaleDateString() },
                    ...accessCodes
                ]);
                setTargetEmail('');
            };

            const deleteCode = (index) => {
                setAccessCodes(accessCodes.filter((_, idx) => idx !== index));
            };

            if (!isAdminAuth) {
                return (
                    <div className="max-w-sm mx-auto bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <div className="text-center mb-5">
                            <h3 className="font-bold text-lg">Admin Login</h3>
                            <p className="text-slate-500 text-xs mt-1">Protected page. Only for Master Admin.</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-4">
                            {errorMsg && <p className="text-xs text-red-500 text-center">{errorMsg}</p>}
                            <input 
                                type="password" 
                                className="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm outline-none"
                                placeholder="Admin Password (admin)" 
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                            />
                            <button type="submit" className="w-full bg-slate-800 text-white font-bold py-3 rounded-xl text-sm">
                                Enter Dashboard
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="space-y-5">
                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex justify-between items-center">
                        <div>
                            <h3 className="font-bold text-slate-800 text-lg">Admin Workspace</h3>
                            <p className="text-slate-500 text-xs">Generate AAB access key tokens</p>
                        </div>
                        <button onClick={() => setIsAdminAuth(false)} className="text-slate-500 font-bold text-xs">Exit</button>
                    </div>

                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                        <h4 className="font-bold text-sm text-slate-800">Generate AAB Access Key</h4>
                        <form onSubmit={generateNewCode} className="flex space-x-2">
                            <input 
                                type="email" 
                                required
                                className="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none"
                                placeholder="client-email@example.com"
                                value={targetEmail}
                                onChange={(e) => setTargetEmail(e.target.value)}
                            />
                            <button type="submit" className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl text-xs">
                                Create Code
                            </button>
                        </form>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-4 border-b font-bold text-sm text-slate-800 bg-slate-50">Active Registrations</div>
                        <div className="divide-y divide-slate-100 max-h-80 overflow-y-auto">
                            {accessCodes.map((item, index) => (
                                <div key={index} className="p-4 flex justify-between items-center text-xs">
                                    <div>
                                        <p className="font-bold text-slate-800">{item.email}</p>
                                        <p className="font-mono text-indigo-600 mt-1 font-semibold">{item.code}</p>
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        {item.used ? (
                                            <span className="text-red-500 font-bold bg-red-50 px-2 py-1 rounded">USED</span>
                                        ) : (
                                            <span className="text-green-500 font-bold bg-green-50 px-2 py-1 rounded">ACTIVE</span>
                                        )}
                                        <button onClick={() => deleteCode(index)} className="text-red-400 font-bold">✕</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
  </html>
